name: LimeSurvey Playwright tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      limesurvey_ref:
        description: LimeSurvey branch, tag or SHA to test
        default: master
        type: string
  # Lets the application pipeline call this suite as its testing/deployment-gate step.
  workflow_call:
    inputs:
      limesurvey_ref:
        description: LimeSurvey branch, tag or SHA to test
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: ${{ matrix.project }} tests
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [smoke, admin, respondent, api, accessibility]
    env:
      DBENGINE: INNODB

    steps:
      - name: Checkout tests
        uses: actions/checkout@v5
        with:
          path: limesurvey-automated-testing

      - name: Checkout LimeSurvey
        uses: actions/checkout@v5
        with:
          path: limesurvey
          repository: LimeSurvey/LimeSurvey
          ref: ${{ inputs.limesurvey_ref || 'master' }}

      - name: Install PHP
        run: |
          sudo add-apt-repository ppa:ondrej/php
          sudo apt update
          sudo apt -y install php8.3
          sudo apt-get update > /dev/null
          sudo apt --fix-broken install php php8.3-ldap php8.3-gd php8.3-intl php8.3-zip php8.3-mysql php8.3-xml php8.3-curl php8.3-mbstring php8.3-sqlite3 libapache2-mod-php8.3 -y
          sudo update-alternatives --set php /usr/bin/php8.3

      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service
          echo -e '[mysql]\nuser="root"\npassword="root"\nhost="localhost"' > "$HOME/.my.cnf"
          sudo service mysql status
          mysql -uroot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';" 2>/dev/null || \
          mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root';" || true
          mysql -uroot -proot -e "CREATE DATABASE limesurvey;"

      - name: Install LimeSurvey dependencies
        working-directory: limesurvey
        run: |
          php tests/check_autoloader.php
          touch enabletests
          composer install --no-interaction --no-progress

      - name: Set up Apache + PHP
        working-directory: limesurvey
        run: |
          sudo cp -f ./tests/CI-pipeline/github-actions-apache /etc/apache2/sites-available/000-default.conf
          sudo sed -e "s?%CI_BUILD_DIR%?$(pwd)?g" --in-place /etc/apache2/sites-available/000-default.conf
          sudo service apache2 restart

          setfacl -dR -m u:www-data:rwX -m u:$(whoami):rwx ./tmp ./upload ./themes ./tests/tmp ./application/config
          chmod -R 777 ./tmp ./upload ./themes ./tests/tmp ./application/config
          sudo chown -R www-data:docker ./tmp
          chmod 777 /home/runner

      - name: Install and configure LimeSurvey
        working-directory: limesurvey
        run: |
          cp application/config/config-sample-mysql.php application/config/config.php
          php application/commands/console.php install admin password TravisLS no@email.com verbose
          # Test-environment settings, inserted at the top of the 'config' array:
          #  - RPCInterface=json enables the RemoteControl API that the fixtures seed data through.
          #  - The loopback allowlists stop the invalid-login/invalid-token tests from locking
          #    out the runner's IP (3 failed attempts = 10 min lockout by default).
          sed -i "/'config' => array(/a\\
                  'RPCInterface' => 'json',\\
                  'loginIpWhitelist' => '127.0.0.1,::1',\\
                  'tokenIpWhitelist' => '127.0.0.1,::1'," application/config/config.php
          php -l application/config/config.php
          grep -q "'RPCInterface' => 'json'" application/config/config.php

      - name: Check the server responds
        run: curl --fail --silent --show-error --output /dev/null http://localhost/index.php/admin/authentication/sa/login

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: limesurvey-automated-testing/package-lock.json

      - name: Install test dependencies and browsers
        working-directory: limesurvey-automated-testing
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests (${{ matrix.project }})
        working-directory: limesurvey-automated-testing
        env:
          CI: 'true'
          BASE_URL: http://localhost/index.php
          LS_ADMIN_USER: admin
          LS_ADMIN_PASSWORD: password
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: limesurvey-automated-testing/playwright-report/
          retention-days: 14

      - name: Upload traces, screenshots and JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}
          path: limesurvey-automated-testing/test-results/
          retention-days: 14

      - name: Apache error log (on failure)
        if: failure()
        run: sudo tail -n 200 /var/log/apache2/error.log || true
